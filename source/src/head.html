<style>
/* Layout: one continuous log of loose sheets (newest at the bottom, composer under the thumb),
   filed by index tabs into cloth-bound books on a shelf whose spines thicken as pages are added. */
:root{
  --paper:#F2F4F3; --sheet:#FFFFFF; --sheet-2:#F6F7F6; --ink:#121815; --ink-2:#434E4A; --ink-3:#6B7672;
  --rule:#DCE1DE; --rule-2:#B4BDB9; --field:#FFFFFF; --field-line:#A9B3AE; --accent:#22407A; --accent-ink:#FFFFFF; --accent-soft:#E3EAF5;
  --out:#B0302A; --in:#1B7145; --warn:#8A5A06; --warn-soft:#FBF1DA; --on-cloth:#FFFFFF;
  --shelf:#B6C1BB; --shelf-edge:#97A39D; --scrim:rgba(13,19,17,.44); --lift:rgba(21,32,27,.08);
  --shadow:0 1px 2px rgba(21,32,27,.06),0 8px 28px rgba(21,32,27,.10);
  --f-display:"Noto Serif KR","Noto Serif CJK KR","AppleMyungjo","Batang","Nanum Myeongjo",serif;
  --f-body:system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR","Noto Sans CJK KR",sans-serif;
  --f-mono:ui-monospace,"SFMono-Regular","Roboto Mono",Menlo,Consolas,monospace;
  --pdf-ink:#18201C; --pdf-mute:#5C6964; --pdf-rule:#D5DCD8; --pdf-paper:#FFFFFF; --pdf-red:#AE2F29; --pdf-green:#1B7145;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1412; --sheet:#161D1A; --sheet-2:#1B2320; --ink:#E2E9E5; --ink-2:#A7B4AE; --ink-3:#7E8B85;
    --rule:#262F2B; --rule-2:#35403B; --field:#1B2320; --field-line:#46524C; --accent:#9CB2EA; --accent-ink:#0D1630; --accent-soft:#1D283F;
    --out:#EF8A80; --in:#6FCB97; --warn:#E3B45B; --warn-soft:#2A2316; --on-cloth:#FFFFFF;
    --shelf:#39433E; --shelf-edge:#262E2A; --scrim:rgba(0,0,0,.62); --lift:rgba(0,0,0,.35);
    --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1412; --sheet:#161D1A; --sheet-2:#1B2320; --ink:#E2E9E5; --ink-2:#A7B4AE; --ink-3:#7E8B85;
  --rule:#262F2B; --rule-2:#35403B; --field:#1B2320; --field-line:#46524C; --accent:#9CB2EA; --accent-ink:#0D1630; --accent-soft:#1D283F;
  --out:#EF8A80; --in:#6FCB97; --warn:#E3B45B; --warn-soft:#2A2316; --on-cloth:#FFFFFF;
  --shelf:#39433E; --shelf-edge:#262E2A; --scrim:rgba(0,0,0,.62); --lift:rgba(0,0,0,.35);
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45);
  color-scheme:dark;
}
html{box-sizing:border-box;height:100%}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow:hidden;word-break:keep-all;overflow-wrap:break-word}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg.i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.gut{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.num,.amt,.t{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{height:100%;display:flex;overflow:hidden}
.side{display:none}
.main{flex:1;min-width:0;display:flex;flex-direction:column;height:100%}
.top{flex:none;background:var(--sheet);border-bottom:1px solid var(--rule)}
.top-in{max-width:808px;margin:0 auto;display:grid;grid-template-columns:minmax(0,1fr);gap:6px;padding-block:8px 8px}
.top-row{display:flex;align-items:center;gap:6px;min-height:40px}
.wordmark{font-family:var(--f-display);font-weight:700;font-size:21px;letter-spacing:-.01em;line-height:1;display:flex;align-items:baseline;gap:6px;margin:0}
.wordmark small{font-family:var(--f-body);font-weight:400;font-size:12px;color:var(--ink-3);letter-spacing:0}
.top-title{font-family:var(--f-display);font-weight:600;font-size:19px;margin:0;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow{flex:1;min-width:0}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3);white-space:nowrap;padding:6px 6px;border:0;background:transparent;border-radius:6px}
.sync:hover{background:var(--sheet-2)}
.sync[data-s="err"]{color:var(--out);font-weight:600}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--in)}
.sync[data-s="busy"] i{background:var(--warn)}
.sync[data-s="err"] i{background:var(--out)}
.sync[data-s="local"] i{background:var(--ink-3)}
.sync[data-s="boot"] i{background:var(--ink-3)}
.nav-row{display:flex;align-items:center;gap:2px}
.nav-row .seg button{min-width:32px;padding:0 9px}
.nav-row .btn.ghost{padding:0 8px}
.date-btn{position:relative;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 6px;border-radius:8px;font-weight:600;font-size:15.5px;min-width:0;white-space:nowrap;overflow:hidden}
.date-btn span{overflow:hidden;text-overflow:ellipsis}
.date-btn input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.date-btn input::-webkit-calendar-picker-indicator,.cmp-chip input::-webkit-calendar-picker-indicator{position:absolute;inset:0;width:auto;height:auto;margin:0;padding:0;opacity:0;cursor:pointer}
.view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;position:relative;background:var(--paper)}
.wrap{max-width:808px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:8px 28px}
.tabs{flex:none;display:flex;background:var(--sheet);border-top:1px solid var(--rule);padding-left:env(safe-area-inset-left, 0px);padding-right:env(safe-area-inset-right, 0px)}
.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;height:56px;border:0;background:transparent;color:var(--ink-3);font-size:11.5px;font-weight:500}
.tabs button[aria-current="page"]{color:var(--accent)}
.tabs svg.i{width:22px;height:22px}
body.typing .tabs{display:none}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:40px;padding:0 14px;border-radius:9px;border:1px solid var(--rule-2);background:var(--sheet);color:var(--ink);font-weight:500;font-size:14.5px;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.dan{color:var(--out)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{height:32px;padding:0 10px;font-size:13.5px;border-radius:7px}
.btn[disabled]{opacity:.5;cursor:default}
.btn svg.i{width:18px;height:18px}
.ibtn{width:40px;height:40px;flex:none;display:inline-grid;place-items:center;border-radius:9px;border:0;background:transparent;color:var(--ink-2)}
.ibtn:hover{background:var(--sheet-2)}
.ibtn.sm{width:32px;height:32px}
.ibtn[disabled]{opacity:.35}
.seg{display:inline-flex;background:var(--sheet-2);border:1px solid var(--rule);border-radius:9px;padding:2px;gap:2px;flex:none}
.seg button{height:30px;min-width:36px;padding:0 10px;border:0;border-radius:7px;background:transparent;color:var(--ink-2);font-size:13.5px;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--sheet);color:var(--ink);box-shadow:0 1px 2px var(--lift)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-4px;padding:2px 4px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}
.chip{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:16px;border:1px solid var(--rule-2);background:var(--sheet);color:var(--ink-2);font-size:13.5px;font-weight:500;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip i.sw{width:8px;height:8px;border-radius:2px;background:var(--bc)}
.in,.sel{width:100%;min-width:0;height:42px;padding:0 12px;border:1.5px solid var(--field-line);border-radius:9px;background:var(--field);color:var(--ink);font-size:16px}
.in::placeholder,textarea::placeholder{color:var(--ink-3);opacity:1}
textarea.in{height:auto;min-height:80px;padding:10px 12px;line-height:1.6;resize:vertical;font-size:16.5px}
.in:focus,.sel:focus{outline:2px solid var(--accent);outline-offset:-1px;border-color:transparent}
.in[readonly]{background:var(--sheet-2);color:var(--ink-2)}
.fld{display:grid;gap:6px;min-width:0}
.fld>label,.lbl{font-size:13px;color:var(--ink-2);font-weight:500}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.5}
.row{display:flex;align-items:center;gap:8px;min-width:0}
.row.wrap-r{flex-wrap:wrap}
.unit{display:flex;align-items:center;gap:6px}
.unit span{font-size:14px;color:var(--ink-2);white-space:nowrap}
.check{display:flex;align-items:flex-start;gap:10px;font-size:14.5px;cursor:pointer}
.check input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--accent);flex:none}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:14px;background:var(--rule-2);transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--sheet);box-shadow:0 1px 2px var(--lift);transition:transform .15s}
.switch input:checked+span{background:var(--accent)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- log ---------- */
.banner{display:flex;gap:10px;align-items:flex-start;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13.5px;color:var(--ink-2)}
.banner.warn{background:var(--sheet);border-color:var(--rule);border-left:4px solid var(--warn);color:var(--ink)}
.banner .grow{line-height:1.5}
.banner .btn{flex:none}
.older{display:flex;justify-content:center;padding:10px 0 2px}
.day{padding-top:18px}
.sec-h{display:flex;align-items:baseline;gap:10px;margin:0 0 10px;font-weight:400;min-width:0}
.sec-h::after{content:"";flex:1;height:1px;background:var(--rule);align-self:center;min-width:12px}
.sec-h .dn{font-family:var(--f-display);font-size:28px;font-weight:600;line-height:1;letter-spacing:-.02em}
.sec-h .dw{font-size:13px;color:var(--ink-2);white-space:nowrap}
.sec-h .big{font-family:var(--f-display);font-size:20px;font-weight:600;line-height:1.2;white-space:nowrap}
.tag-today{font-size:11px;font-weight:600;padding:2px 6px;border-radius:4px;background:var(--accent);color:var(--accent-ink);align-self:center}
.sheets{display:grid;gap:8px}
.sheet{background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:11px 14px 12px;display:grid;gap:7px;cursor:pointer;min-width:0;text-align:left;position:relative}
.sheet:hover{border-color:var(--rule-2)}
.sheet.new{animation:rise .35s ease-out}
@keyframes rise{from{transform:translateY(6px);opacity:.4}to{transform:none;opacity:1}}
.sheet-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--ink-3);min-height:22px}
.t{font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.idx{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px 0 6px;border:1px solid var(--rule);border-radius:5px;background:var(--sheet-2);color:var(--ink-2);font-size:12px;font-weight:500;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.idx i{width:6px;height:12px;border-radius:1.5px;background:var(--bc);flex:none}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 7px;border-radius:5px;font-size:11.5px;font-weight:600;white-space:nowrap}
.pill.per{background:var(--accent-soft);color:var(--accent)}
.pill.ex{background:var(--warn-soft);color:var(--warn)}
.pill.run{color:var(--ink-2);font-weight:500}
.pill.todo{background:var(--sheet-2);color:var(--ink-2);border:1px solid var(--rule);font-weight:500}
.spin{width:12px;height:12px;border-radius:50%;border:2px solid var(--rule-2);border-top-color:var(--accent);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.memo{margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:16px;line-height:1.65;color:var(--ink)}
.memo.dim{color:var(--ink-3);font-style:italic}
.filed{display:grid;gap:3px}
.filed-row{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 12px;font-size:13px;color:var(--ink)}
.filed-row .k{color:var(--ink-3);margin-right:5px}
.filed-row .bk{display:inline-flex;align-items:center;gap:5px;color:var(--ink-2);font-weight:500}
.filed-row .bk i{width:6px;height:12px;border-radius:1.5px;background:var(--bc)}
.mlines{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.mline{display:flex;align-items:baseline;gap:8px;font-size:13.5px;min-width:0}
.mline .l{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mline .lead{flex:1;min-width:14px;border-bottom:1px dotted var(--rule-2);transform:translateY(-4px)}
.mline .where{font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.amt{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.amt.out{color:var(--out)}
.amt.inc{color:var(--in)}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumb{width:64px;height:64px;border-radius:8px;border:1px solid var(--rule);background:var(--sheet-2);overflow:hidden;display:grid;place-items:center;padding:0;position:relative;color:var(--ink-2)}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .ft{font-size:10.5px;font-weight:600;font-family:var(--f-mono)}
.thumb .fl{position:absolute;left:0;right:0;bottom:0;font-size:10px;background:var(--scrim);color:var(--on-cloth);padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sug{border:1px dashed var(--rule-2);border-radius:8px;padding:9px 10px;display:grid;gap:6px;background:var(--sheet-2);cursor:default}
.sug .hd{font-size:12.5px;font-weight:600;color:var(--ink-2)}
.sug .acts{display:flex;gap:6px;flex-wrap:wrap}
.relink{border:0;background:none;padding:0;color:var(--accent);font-size:12.5px;font-weight:500;text-align:left}
.empty-log{margin-top:20px;background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:18px 16px;display:grid;gap:12px}
.empty-log h2{font-family:var(--f-display);font-size:19px;margin:0}
.empty-log p{margin:0;color:var(--ink-2);font-size:14px}
.try{display:grid;gap:6px}
.try button{text-align:left;border:1px solid var(--rule);background:var(--sheet-2);border-radius:9px;padding:9px 12px;font-size:14px;color:var(--ink);line-height:1.5}
.day-empty{font-size:13.5px;color:var(--ink-3);padding:4px 2px 2px}

/* week + month */
.wk,.mo{padding-top:20px}
.sec-meta{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--ink-2);margin:-2px 0 10px}
.sec-meta b{font-weight:600;color:var(--ink)}
.daylist{list-style:none;margin:8px 0 0;padding:0;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;overflow:hidden}
.daylist li+li{border-top:1px solid var(--rule)}
.daylist button{width:100%;display:grid;grid-template-columns:62px 1fr auto;gap:10px;align-items:start;padding:10px 12px;border:0;background:transparent;text-align:left}
.daylist .d1{font-family:var(--f-mono);font-size:13px;color:var(--ink-2);padding-top:1px}
.daylist .d2{min-width:0;font-size:13.5px;line-height:1.5;color:var(--ink);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.daylist .d3{font-size:12px;color:var(--ink-3);white-space:nowrap;padding-top:2px}
.add-period{margin-top:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;background:var(--sheet);border:1px solid var(--rule);border-radius:10px;padding:8px 6px}
.cal .dh{font-size:11.5px;color:var(--ink-3);text-align:center;padding:2px 0 4px}
.cal button{min-height:44px;border:0;background:transparent;border-radius:8px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:6px 0 4px;gap:4px;font-size:13.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.cal button:hover{background:var(--sheet-2)}
.cal button.off{visibility:hidden}
.cal button.today{box-shadow:inset 0 0 0 1.5px var(--accent);font-weight:600}
.cal button.has{font-weight:600}
.cal .dots{display:flex;gap:2px;height:5px}
.cal .dots i{width:5px;height:5px;border-radius:50%;background:var(--bc)}
.statline{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.statline .idx{height:26px}

/* ---------- composer ---------- */
.composer{flex:none;background:var(--sheet);border-top:1px solid var(--rule);box-shadow:0 -2px 10px rgba(21,32,27,.05)}
.cmp-in{max-width:808px;margin:0 auto;padding-block:6px 8px;display:grid;gap:6px}
.cmp-meta{display:flex;align-items:center;gap:6px;min-height:28px;flex-wrap:wrap}
.cmp-chip{position:relative;display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:14px;border:1px solid var(--rule-2);background:var(--sheet);font-size:12.5px;font-weight:500;color:var(--ink-2);white-space:nowrap}
.cmp-chip.alt{border-color:var(--accent);color:var(--accent)}
.cmp-chip input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;border:0;padding:0}
.cmp-chip svg.i{width:15px;height:15px}
.cmp-row{display:flex;align-items:flex-end;gap:6px;background:var(--field);border:1.5px solid var(--field-line);border-radius:14px;padding:4px}
.cmp-row:focus-within{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.cmp-row textarea{flex:1;min-width:0;border:0;background:var(--field);resize:none;font-size:16.5px;line-height:1.5;padding:8px 4px;max-height:160px;outline:none;color:var(--ink)}
.send{width:40px;height:40px;border-radius:10px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.send[disabled]{background:var(--rule-2);color:var(--sheet)}
.pend{display:flex;gap:6px;flex-wrap:wrap}
.pend span{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 4px 0 10px;border-radius:14px;background:var(--sheet);border:1px solid var(--rule);font-size:12.5px;max-width:220px}
.pend span b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ---------- shelf ---------- */
.shelf{margin-top:14px}
.shelf-row{display:flex;align-items:flex-end;gap:7px;padding:0 8px;min-height:240px}
.shelf-board{height:10px;border-radius:2px;background:var(--shelf);box-shadow:0 4px 0 var(--shelf-edge);margin:0 0 30px}
.spine{--w:50px;--h:200px;width:var(--w);height:var(--h);background:var(--bc);color:var(--on-cloth);border:0;border-radius:3px 3px 1px 1px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:16px 0 9px;box-shadow:inset -4px 0 0 rgba(0,0,0,.16),inset 2px 0 0 rgba(255,255,255,.12),0 1px 0 rgba(0,0,0,.18);transition:transform .15s ease-out;flex:none;overflow:hidden}
.spine::before,.spine::after{content:"";position:absolute;left:0;right:0;height:2px;background:rgba(255,255,255,.28)}
.spine::before{top:9px}
.spine::after{bottom:31px}
.spine:hover{transform:translateY(-4px)}
.sp-title{display:flex;flex-direction:column;align-items:center;font-family:var(--f-display);font-weight:600;font-size:14px;line-height:1.08}
.sp-title b{display:block;font-weight:600}
.sp-title i{display:block;height:6px}
.sp-count{font-family:var(--f-mono);font-size:10.5px;opacity:.9;white-space:nowrap}

.spine.add{background:transparent;color:var(--ink-3);border:1.5px dashed var(--rule-2);box-shadow:none}
